# In-browser (WebAssembly) environment for try-fatqat.
#
# numba has no WebAssembly build, so fatqat is installed by jupyterlite-xeus
# with pip's --no-deps and its remaining dependencies come from
# emscripten-forge. Notebooks must therefore select runtime="numpy" on
# simulators; scripts/sync_fatqat.py includes only tutorials that do.
name: xeus-lite-wasm
channels:
  - https://repo.prefix.dev/emscripten-forge-4x
  - conda-forge
dependencies:
  - xeus-python
  - numpy
  - scipy
  - matplotlib
  - qutip
  # Used by the qnn-digits tutorial.
  - scikit-learn
  - pip
  - pip:
      # Left unpinned: scripts/sync_fatqat.py pins the release whose tutorials
      # it renders, in try-fatqat-env.pinned.yaml.
      - fatqat
      - qutip-qip>=0.4,<0.5
